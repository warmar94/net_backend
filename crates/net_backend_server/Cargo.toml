[package]
name = "net_backend_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A framework for game backend servers: tokio + axum, modules with hooks, MySQL / PostgreSQL / SQLite, migrations, OpenAPI."
license.workspace = true
repository.workspace = true
homepage = "https://github.com/warmar94/net_backend/tree/main/crates/net_backend_server"
readme = "README.md"
keywords = ["gamedev", "server", "backend", "axum", "websocket"]
categories = ["game-development", "network-programming", "web-programming::http-server"]
# Not part of the published package.
exclude = ["NOTES.md", "docs/", "/target"]

[features]
# MySQL is the default database (owner decision); every backend is additive and any combination
# compiles. At least one is needed at runtime: without any, starting the server is a clear error.
default = ["mysql"]
# MySQL / MariaDB through sqlx (TLS: rustls with ring, webpki roots).
mysql = ["sqlx/mysql", "sqlx/tls-rustls-ring-webpki", "sea-query-sqlx/sqlx-mysql"]
# PostgreSQL through sqlx (TLS: rustls with ring, webpki roots).
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-webpki", "sea-query-sqlx/sqlx-postgres"]
# SQLite through sqlx, with SQLite itself compiled in (no system library needed).
sqlite = ["sqlx/sqlite-bundled", "sea-query-sqlx/sqlx-sqlite"]
# The real Steam ticket check (`ISteamUserAuth/AuthenticateUserTicket` over HTTPS: hyper + rustls with
# ring, webpki roots). Without it the Steam route works with an app-provided `SteamVerifier`.
steam = ["dep:hyper-rustls", "dep:rustls", "hyper-util/client-legacy", "hyper-util/http1"]
# The SMTP mailer (lettre, rustls with ring, webpki roots). Without it mail goes to the log mailer
# or an app-provided `Mailer`.
smtp = ["dep:lettre"]
# The storage module (per-user JSON objects / saves: `/v1/storage`). No extra dependency; off by
# default like every module (a server registers only what it uses).
storage = []
# The chat module (rooms, DMs, history, presence over the WebSocket hub). No extra dependency.
chat = []

[dependencies]
# The shared message types (error body, routes, version, ids, timestamps).
net_backend_protocol = { path = "../net_backend_protocol", version = "0.1.0" }

# HTTP. Caret minimums (PLUGINS §8): apps depend on axum / tower-http themselves, and an `=` pin
# would break their resolution at the next patch. These crates are re-exported and part of our
# public API, so a minor bump of any of them is a minor bump of this crate.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "query", "tokio", "tracing", "ws"] }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "cors", "limit", "trace"] }
# The connection loop (header-read timeout, tracked connections for the shutdown deadline); already
# in the tree through axum.
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", default-features = false, features = ["tokio", "server", "http1", "service"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# Ubiquitous crates: caret minimums (an exact pin would force every app's version).
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
http = "1.3"
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
# tungstenite's error type, to recognise a message over the limit (axum does not re-export it). The
# same version axum's `ws` feature brings (nothing new in the tree); re-check when axum moves.
tungstenite = { version = "0.29.0", default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
toml = { version = "1.0", default-features = false, features = ["parse", "display", "serde", "std"] }
# 0.10: the version sqlx-core always brings (one copy fewer; the checksum is the same).
sha2 = { version = "0.10.9", default-features = false }

# Accounts: argon2id password hashes (salts from the OS through getrandom), HMAC-SHA-256 for the
# refresh-rotation derivation, random tokens from getrandom.
argon2 = "0.6.0"
getrandom = "0.4.3"
hmac = "0.12.1"
# NFC for emails and passwords (the same text typed on different keyboards compares equal).
unicode-normalization = "0.1.25"

# Steam (feature `steam`): an HTTPS client without OpenSSL / aws-lc (hyper-rustls with ring).
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"], optional = true }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"], optional = true }

# Mail (feature `smtp`): lettre's SMTP transport on tokio with rustls + ring (no native-tls / aws-lc).
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-tls"], optional = true }

# Database: sqlx pools behind the `Db` enum, statements built with sea-query (one statement, three
# dialects). Caret minimums: apps use sqlx directly (pools, `FromRow`); re-exported (see above).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "derive"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-mysql", "backend-postgres", "backend-sqlite", "thread-safe"] }
sea-query-sqlx = { version = "0.9.1", default-features = false }

# OpenAPI. Caret minimums: apps use utoipa's macros directly (re-exported, see above).
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = { version = "0.3.0" }

# Metrics: the facade is shared with the app (caret); the exporter without its HTTP listener and
# push gateway (the push gateway would bring aws-lc).
metrics = "0.24.2"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
http-body-util = "0.1.3"
# A WebSocket client for the hub tests: the same tokio-tungstenite axum's `ws` feature already brings.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std", "sink"] }

[[example]]
name = "minimal"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

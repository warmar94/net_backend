# The {{name}} server's configuration (development). `cargo run` reads it from the current folder.
# Every key is described in the net_backend_server guide: https://docs.rs/net_backend_server
# (Configuration). An environment variable NBS__<SECTION>__<KEY> overrides a key, e.g.
# NBS__SERVER__BIND=0.0.0.0:8080.

[server]
bind = "127.0.0.1:8080"

[database]
{{database}}
# Apply the migrations of the modules (and your own, in ./migrations) at every start.
migrate_on_start = true

[log]
level = "info"
format = "pretty"
{{module_sections}}

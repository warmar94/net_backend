name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repository (no job pushes, comments or uploads releases).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# Rust is pinned to the dev version (never @stable): a newer Rust's new clippy lints must not turn CI red on
# unchanged code. Upgrading Rust = bump this in every job, run clippy, fix. Users are unaffected (rust-version).
# Every action is pinned by its commit (the comment names its tag or branch), as in docker.yml.
#
# One workspace, one lockfile. Every job selects its crate with `-p`, so only that crate's features are enabled
# (resolver 2): the server is never built with the protocol's `bevy_net_backend` feature.
jobs:
  fmt:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - run: cargo fmt --all --check

  # net_backend_protocol: every feature combination on its own (build, clippy, tests incl. the README doctests, docs).
  protocol:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - ""
          - "--features bevy_net_backend"
          - "--all-features"
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p net_backend_protocol --locked --all-targets ${{ matrix.features }}
      - run: cargo clippy -p net_backend_protocol --locked --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p net_backend_protocol --locked ${{ matrix.features }}
      - run: cargo doc -p net_backend_protocol --locked --no-deps ${{ matrix.features }}

  # net_backend_server: each database backend alone, the default, the modules (storage, chat, leaderboards, notifications, friends, groups, oauth, lobbies, matchmaking, files) alone and together,
  # and everything (build, clippy, tests, docs). SQLite runs in process; the MySQL / PostgreSQL suites are ignored
  # here and run in `databases`.
  server:
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features --features mysql"
          - "--no-default-features --features postgres"
          - "--no-default-features --features sqlite"
          - ""
          - "--no-default-features --features sqlite,storage"
          - "--no-default-features --features sqlite,chat"
          - "--no-default-features --features sqlite,leaderboards"
          - "--no-default-features --features sqlite,notifications"
          - "--no-default-features --features sqlite,friends"
          - "--no-default-features --features sqlite,groups"
          - "--no-default-features --features sqlite,oauth"
          - "--no-default-features --features sqlite,files"
          - "--no-default-features --features sqlite,lobbies"
          - "--no-default-features --features sqlite,matchmaking"
          - "--no-default-features --features mysql,storage,chat"
          - "--all-features"
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p net_backend_server --locked --all-targets ${{ matrix.features }}
      - run: cargo clippy -p net_backend_server --locked --all-targets ${{ matrix.features }} -- -D warnings
      # Diagnostic (CI hang 2026-10-02): if a test binary of the ws suite runs over 2 minutes (it normally takes
      # ~10 s), print every thread's stack once, so the log shows where it is stuck. The watchdog still aborts it.
      - run: command -v gdb >/dev/null || sudo apt-get install -y -qq gdb >/dev/null
      - run: |
          (
            done_pids=""
            while sleep 15; do
              for pid in $(pgrep -f 'target/debug/deps/ws-[0-9a-f]+' || true); do
                case " $done_pids " in *" $pid "*) continue ;; esac
                age=$(ps -o etimes= -p "$pid" | tr -d ' ')
                if [ -n "$age" ] && [ "$age" -gt 120 ]; then
                  echo "::group::stacks of the ws test binary (pid $pid, running ${age}s)"
                  sudo gdb -p "$pid" -batch -ex 'set pagination off' -ex 'thread apply all bt' 2>&1 | grep -v '^\[New LWP' | head -n 1500
                  echo "::endgroup::"
                  done_pids="$done_pids $pid"
                fi
              done
            done
          ) &
          watcher=$!
          status=0
          cargo test -p net_backend_server --locked ${{ matrix.features }} || status=$?
          kill "$watcher" 2>/dev/null || true
          exit "$status"
      - run: cargo doc -p net_backend_server --locked --no-deps ${{ matrix.features }}
      # Without any backend the crate must still compile (starting a server then fails clearly).
      - if: matrix.features == '--all-features'
        run: |
          cargo build -p net_backend_server --locked --no-default-features
          cargo test -p net_backend_server --locked --no-default-features --lib
          cargo clippy -p net_backend_server --locked --all-targets --no-default-features --features storage,chat -- -D warnings
          cargo clippy -p net_backend_server --locked --all-targets --no-default-features --features steam,smtp -- -D warnings
          cargo test -p net_backend_server --locked --no-default-features --features sqlite,steam,smtp --test external_fakes

  # net_backend_client: every feature set (build, clippy, tests against the real server on loopback and the
  # in-process mock SSH server, docs). The plain `--lib` build has no dev-dependencies, so a tokio feature the
  # client forgot cannot hide behind the server's (feature unification of the test build).
  client:
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "--features ws"
          - "--features ssh"
          - "--features sftp"
          - "--all-features"
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p net_backend_client --locked --lib ${{ matrix.features }}
      - run: cargo build -p net_backend_client --locked --all-targets ${{ matrix.features }}
      - run: cargo clippy -p net_backend_client --locked --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test -p net_backend_client --locked ${{ matrix.features }}
      - run: cargo doc -p net_backend_client --locked --no-deps ${{ matrix.features }}

  # End to end: the server's WebSocket hub, storage and chat driven by the published Bevy client (`bevy_net_backend`)
  # in a headless app over loopback. Bevy (and the protocol's `bevy_net_backend` feature) is only in this
  # unpublished crate (`crates/e2e_tests`), never in the server's own builds (`-p net_backend_server`).
  e2e:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p e2e_tests --locked --all-targets
      - run: cargo clippy -p e2e_tests --locked --all-targets -- -D warnings
      - run: cargo test -p e2e_tests --locked

  # The server's database, auth, storage, chat, leaderboards, notifications, friends, groups, oauth, lobbies, files and storage-visibility suites against real MySQL 8.4, MariaDB 11.4 and PostgreSQL 16 (each
  # test creates and drops its own database).
  databases:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nbs-ci-password
          MYSQL_DATABASE: nbs
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pnbs-ci-password"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nbs-ci-password
          MARIADB_DATABASE: nbs
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nbs-ci-password
          POSTGRES_DB: nbs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NBS_TEST_MYSQL_URL: mysql://root:nbs-ci-password@127.0.0.1:3306/nbs
      NBS_TEST_POSTGRES_URL: postgres://postgres:nbs-ci-password@127.0.0.1:5432/nbs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p net_backend_server --locked --all-features --test db --test auth --test storage --test chat --test chat_extras --test leaderboards --test notifications --test friends --test friends_presence_cost --test friends_steam --test groups --test oauth --test lobbies --test files --test storage_visibility -- --include-ignored
      - run: cargo test -p net_backend_server --locked --no-default-features --features mysql,storage,chat,leaderboards,notifications,friends,groups,oauth,lobbies,files --test db --test auth --test storage --test chat --test chat_extras --test leaderboards --test notifications --test friends --test friends_presence_cost --test friends_steam --test groups --test oauth --test lobbies --test files --test storage_visibility -- --include-ignored
      - run: cargo test -p net_backend_server --locked --no-default-features --features postgres,storage,chat,leaderboards,notifications,friends,groups,oauth,lobbies,files --test db --test auth --test storage --test chat --test chat_extras --test leaderboards --test notifications --test friends --test friends_presence_cost --test friends_steam --test groups --test oauth --test lobbies --test files --test storage_visibility -- --include-ignored
      - name: MariaDB (through the mysql feature)
        run: cargo test -p net_backend_server --locked --no-default-features --features mysql,storage,chat,leaderboards,notifications,friends,groups,oauth,lobbies,files --test db --test auth --test storage --test chat --test chat_extras --test leaderboards --test notifications --test friends --test friends_presence_cost --test friends_steam --test groups --test oauth --test lobbies --test files --test storage_visibility -- --include-ignored
        env:
          NBS_TEST_MYSQL_URL: mysql://root:nbs-ci-password@127.0.0.1:3307/nbs

  # The minimum supported Rust version (`rust-version` in the workspace Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p net_backend_protocol --locked --no-default-features
      - run: cargo build -p net_backend_protocol --locked --all-features
      - run: cargo build -p net_backend_server --locked --no-default-features --features sqlite,storage,chat
      - run: cargo build -p net_backend_server --locked --all-features
      - run: cargo build -p net_backend_client --locked
      - run: cargo build -p net_backend_client --locked --all-features

  # The dependency rules.
  deps:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
      # Protocol: no engine, async runtime or I/O crate without the feature.
      - name: protocol has no runtime, I/O or engine by default
        run: |
          for f in "--no-default-features" ""; do
            if cargo tree -p net_backend_protocol --locked --target all -e normal,build $f --prefix none | grep -E '^(bevy[a-z_]*|tokio|mio|async-[a-z-]+|futures[a-z-]*|hyper|reqwest|ureq|tungstenite|rustls|ring|openssl-sys) '; then
              echo "forbidden dependency in net_backend_protocol with [$f]"; exit 1
            fi
          done
      # Protocol with the client feature: every bevy* crate at 0.19.0 (the client's exact pin), exactly one bevy_ecs.
      - name: one Bevy, 0.19.0
        run: |
          # The Bevy client itself (bevy_net_backend) has its own version; every other bevy* crate is Bevy.
          if awk '/^name = "bevy/ { name = $3; getline; if (name != "\"bevy_net_backend\"" && $3 != "\"0.19.0\"") { print name, $3; found = 1 } } END { exit !found }' Cargo.lock; then
            echo "a bevy* crate other than 0.19.0 is in Cargo.lock"; exit 1
          fi
          if [ "$(cargo tree -p net_backend_protocol --locked --all-features -e normal -i bevy_ecs --depth 0 --prefix none | wc -l)" != "1" ]; then
            echo "more than one bevy_ecs"; exit 1
          fi
      # Server and client: no OpenSSL / native-tls / aws-lc, no game engine, exactly one tokio.
      - name: server and client have no OpenSSL / native-tls / aws-lc / engine, one tokio
        run: |
          check() {
            if cargo tree "$@" --locked --target all -e normal,build --prefix none | grep -E '^(openssl|openssl-sys|native-tls|aws-lc-rs|aws-lc-sys|bevy[a-z_]*) '; then
              echo "forbidden dependency with [$*]"; exit 1
            fi
          }
          for f in "" "--features ws" "--features ssh" "--features sftp" "--all-features"; do
            check -p net_backend_client $f
            if [ "$(cargo tree -p net_backend_client --locked --target all -e normal $f -i tokio --depth 0 --prefix none | grep -E '^tokio v' | sort -u | wc -l)" != "1" ]; then
              echo "more than one tokio in net_backend_client with [$f]"; exit 1
            fi
          done
          check -p load_test
          for f in "--all-features" "" "--no-default-features --features sqlite" "--no-default-features --features postgres" "--no-default-features --features sqlite,steam,smtp" "--no-default-features --features mysql,storage,chat"; do
            check -p net_backend_server $f
            # `-i tokio` can print the same version several times (one block per target set): count VERSIONS.
            if [ "$(cargo tree -p net_backend_server --locked --target all -e normal $f -i tokio --depth 0 --prefix none | grep -E '^tokio v' | sort -u | wc -l)" != "1" ]; then
              echo "more than one tokio with [$f]"; exit 1
            fi
          done

  # Nothing private in any package. `--list` only: packaging the server for real needs the protocol on crates.io.
  package:
    runs-on: ubuntu-latest
    # A hang fails the job instead of eating CI time (the ws tests also abort themselves).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
      - run: |
          for c in net_backend_protocol net_backend_server net_backend_client; do
            cargo package -p $c --locked --list --allow-dirty > files-$c.txt
            echo "== $c"; cat files-$c.txt
            if grep -E '(^|/)(NOTES\.md|docs/)' files-$c.txt; then echo "private files in the $c package"; exit 1; fi
            for f in README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE Cargo.toml src/lib.rs; do
              grep -qx "$f" files-$c.txt || { echo "$f missing from the $c package"; exit 1; }
            done
          done

  # The load generator (crates/load_test, never published): builds cleanly.
  load_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p load_test --locked --all-targets
      - run: cargo clippy -p load_test --locked --all-targets -- -D warnings

  # The project generator (crates/net_backend, the `net-backend` command): build, clippy, unit tests, docs, then the
  # end-to-end test: `new`, `new-server` and `new-client` under target/ (a path with a space), each project built and
  # linted against this repository's crates (a [patch.crates-io] added by the test), both generated servers run on
  # loopback with SQLite, `GET /v1/info` checked, the generated clients run against them (login, save, chat).
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p net_backend --locked --all-targets
      - run: cargo clippy -p net_backend --locked --all-targets -- -D warnings
      - run: cargo test -p net_backend --locked
      - run: cargo doc -p net_backend --locked --no-deps
      # The release check against crates.io (published_crates_build_and_run) is run by hand, not here.
      - run: cargo test -p net_backend --locked --test e2e -- --ignored --nocapture generated_projects

  # The deployment files (deploy/): shell scripts, the Compose files, both Caddyfiles, the production
  # configurations (checked by the reference server itself), the Docker image build, the trial one-liner
  # and both Compose stacks brought up with that image (DOMAIN=localhost).
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck -S warning deploy/systemd/install.sh deploy/systemd/net-backend-cli deploy/backup/*.sh
      - name: compose files
        run: |
          cd deploy/docker
          for db in mysql postgres; do
            DOMAIN=api.example.com docker compose -f "compose.$db.yaml" config -q
            DOMAIN=api.example.com ACME_EMAIL=admin@example.com docker compose -f "compose.$db.yaml" config -q
            # DOMAIN is required: without it Compose refuses the file.
            if docker compose -f "compose.$db.yaml" config -q 2>/dev/null; then echo "compose.$db.yaml accepted a missing DOMAIN" >&2; exit 1; fi
          done
      - name: Caddyfiles (the image the compose files pin)
        run: |
          mkdir -p /tmp/caddy/sites /tmp/caddy-docker
          sed -e 's/API_DOMAIN/api.example.com/' -e 's/ACME_EMAIL/admin@example.com/' -e 's|/var/log/caddy/net-backend.log|/tmp/caddy-test.log|' \
            deploy/systemd/net-backend.caddy > /tmp/caddy/sites/net-backend.caddy
          cp deploy/systemd/Caddyfile /tmp/caddy/Caddyfile
          docker run --rm -v /tmp/caddy:/etc/caddy:ro caddy:2.11 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # The Caddyfile inline in each compose file, with and without ACME_EMAIL.
          for db in mysql postgres; do
            for email in "" admin@example.com; do
              DOMAIN=api.example.com ACME_EMAIL="$email" docker compose -f "deploy/docker/compose.$db.yaml" config --format json \
                | jq -r '.configs.caddyfile.content' > /tmp/caddy-docker/Caddyfile
              docker run --rm -v /tmp/caddy-docker:/etc/caddy:ro caddy:2.11 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            done
          done
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: the production configurations are valid (systemd's file, the compose files' inline one, the image's)
        run: |
          printf 'sqlite:%s/nbs.db' "$RUNNER_TEMP" > "$RUNNER_TEMP/database_url"
          run() { cargo run -q -p net_backend_server --locked --example server --no-default-features --features sqlite,storage,chat,leaderboards,notifications,friends,groups,oauth,lobbies,matchmaking,files -- "$@"; }
          NBS_CONFIG=deploy/config/config.toml NBS__DATABASE__URL_FILE="$RUNNER_TEMP/database_url" run config check --connect
          NBS_CONFIG=deploy/config/config.toml NBS__DATABASE__URL_FILE="$RUNNER_TEMP/database_url" run migrate
          DOMAIN=api.example.com docker compose -f deploy/docker/compose.postgres.yaml config --format json | jq -r '."x-nbs-config"' > "$RUNNER_TEMP/compose.toml"
          NBS_CONFIG="$RUNNER_TEMP/compose.toml" NBS__DATABASE__URL_FILE="$RUNNER_TEMP/database_url" run config check --connect
          NBS_CONFIG=deploy/docker/trial.toml run config check
      - name: Docker image
        run: docker build -f deploy/docker/Dockerfile -t net-backend-server:ci .
      - name: the trial one-liner
        run: |
          docker run -d --name nbs-trial -p 127.0.0.1:8080:8080 net-backend-server:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/v1/info && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/v1/info | grep -q '"auth","chat","files","friends","groups","leaderboards","lobbies","matchmaking","notifications","oauth","storage"' || { docker logs nbs-trial; exit 1; }
          docker rm -f nbs-trial
      - name: the compose stacks (DOMAIN=localhost, Caddy's local certificate)
        run: |
          mkdir -p "$RUNNER_TEMP/stack"
          for db in postgres mysql; do
            cp "deploy/docker/compose.$db.yaml" "$RUNNER_TEMP/stack/compose.yaml"
            printf 'DOMAIN=localhost\nNBS_IMAGE=net-backend-server:ci\n' > "$RUNNER_TEMP/stack/.env"
            (cd "$RUNNER_TEMP/stack" && docker compose up -d --wait --wait-timeout 300) || {
              (cd "$RUNNER_TEMP/stack" && docker compose ps -a && docker compose logs); exit 1; }
            for i in $(seq 1 30); do curl -fsSk https://localhost/v1/info && break; sleep 2; done
            curl -fsSk https://localhost/v1/info | grep -q '"chat"'
            (cd "$RUNNER_TEMP/stack" && docker compose exec -T server net-backend-server user:create admin@example.com --admin >/dev/null)
            # A second `up` keeps the secrets and the data (the migrate run finds nothing pending).
            (cd "$RUNNER_TEMP/stack" && docker compose up -d --wait --wait-timeout 300)
            curl -fsSk https://localhost/v1/info >/dev/null
            (cd "$RUNNER_TEMP/stack" && docker compose down -v)
          done
